<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sales Order</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--p:#075e54;--p2:#128c7e;--g:#25d366;--bg:#f3f5f6;--card:#fff;--text:#172026;--muted:#68737a;--danger:#d9534f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:88px}.top{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));box-shadow:0 2px 8px #0002}
.toprow{display:flex;align-items:center;justify-content:space-between}.title{font-size:20px;font-weight:800}.sub{font-size:12px;opacity:.85;margin-top:2px}
.container{max-width:680px;margin:auto;padding:12px}.card{background:var(--card);border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}
label{font-size:12px;font-weight:800;color:#455057;display:block;margin-bottom:6px}
select,input{width:100%;border:1px solid #d8dee1;background:#fafbfb;border-radius:11px;padding:13px;font-size:16px;outline:0}select:focus,input:focus{border-color:var(--p)}
.shoprow{display:flex;gap:8px}.shoprow select{flex:1}.reset{border:0;border-radius:11px;padding:0 14px;background:#eee;color:#333;font-weight:700}
.search{position:relative}.search input{padding-left:40px}.search span{position:absolute;left:13px;top:12px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:5px 2px 9px}.sectionhead b{font-size:16px}.count{font-size:12px;color:var(--muted)}
.product{background:#fff;border:1px solid #e4e8ea;border-radius:14px;padding:12px;margin-bottom:9px;display:flex;gap:9px;align-items:center}
.product.selected{border-color:var(--g);background:#f4fff8}.info{min-width:0;flex:1}.name{font-weight:750;font-size:14px;line-height:1.25}.meta{font-size:11px;color:var(--muted);margin-top:4px}.warn{font-size:10px;color:var(--danger);font-weight:800;margin-top:3px}
.qty{display:flex;align-items:center;gap:5px}.qbtn{width:36px;height:36px;border:0;border-radius:50%;background:#e8ebed;font-size:21px;font-weight:800}.qinput{width:48px;padding:7px 2px;text-align:center;font-weight:800}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;box-shadow:0 -4px 15px #0002;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.bottomin{max-width:680px;margin:auto;display:flex;align-items:center;gap:10px}.total{flex:1;font-size:12px;color:#5d666b}.total strong{display:block;color:#111;font-size:20px}.wa{border:0;background:var(--g);color:#fff;border-radius:12px;padding:13px 16px;font-weight:850;font-size:14px}
.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:28px}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(min-width:680px){.bottom{padding-bottom:10px}}
</style>
</head>
<body>
<header class="top"><div class="toprow"><div><div class="title">📦 Sales Order</div><div class="sub">Fast mobile order entry</div></div><button id="clearBtn" style="border:0;background:#ffffff22;color:white;border-radius:9px;padding:8px 10px;font-weight:700">Clear</button></div></header>

<main class="container">
<section class="card">
<label>📅 DAY & ROUTE</label>
<select id="route"></select>
<div style="height:12px"></div>
<label>🏪 SHOP</label>
<div class="shoprow"><select id="shop"><option value="">-- Select shop --</option></select></div>
</section>

<section id="productsSection" class="hidden">
<div class="card search"><span>🔍</span><input id="search" placeholder="Search product..." autocomplete="off"></div>
<div class="sectionhead"><b>Products</b><span class="count" id="count"></span></div>
<div id="list"></div>
</section>
</main>

<div id="toast" class="toast"></div>
<footer id="bottom" class="bottom hidden"><div class="bottomin"><div class="total"><span id="itemCount">0 items</span><strong id="total">₹0.00</strong></div><button class="wa" id="send">📲 Send Order</button></div></footer>

<script>
const routes={
"Monday - Akota":["Shri Jalaram Store","Jyoti Store","Gayatri Store","Guruprem Super Store","One Stop General Store","Shri Sitaram Krupa Pro Store","Shital Provision Store","Yadav Provision Store","Arihant Provision Store","Welcome Enterprise","Shri Ambica Store","Laxmi Provision Store","Jalaram Provision Store","Shreeji Stationary & Gift Shop","New Uttam Provision Store"],
"Tuesday - Sama":["Mahaveer General Store","Shri Jay Umiya Traders","Maa Sweets & Farshan","Dwarkash Pan","Vishwakarma Pan Corner","Suleshwari Provision Store","Jay Jalaram Provision Store","Radha Krishna Provision Store","Anita Kirana Store","Laxmi Narayan Provision Store (Opp. Anita)","Banna House","Shri Badhrikedar Provision","Yadav Provision Store","Kushi Provision Store","Ma Genral Store","Jay Ambe Provision Store","Mapels","Laxmi Provision Store"],
"Wednesday - Nawayard":["Bajrang Provision Store","Balaji Medical & Provision Store","Sunita Provision Store","Jalaram Provision Store","Ya Chistiya Provision Store","Mehboob Provision Store","Kabirkha Provision Store","Imran Provision Store","Pathan Provision Store (Opp. Imran)","Shri Nathji Provision Store","Shri Ganesh Provision Store","New Onest Provision Store","Asrafi Provision Store","Jay Ambe Provision Store","Vijay Provision Store","Jay Mahakali Baroda Dairy Kendra","Shourya Provision Store","Navpad Provision Store","Natraj Provision Store","Chitiya Provision Store","Insha Provision Store","MK Super Mart"],
"Thursday - Laxmipura":["Darwarkesh Milk Center","Himani Provision Store","Tejas General Store","Rajesh Provision Store","Jay Ambe Meldi Store","Kamlesh Super Store","Ambika Provision Store","Shakti Pan","Mahakali Pan Corner","Dwarkadhish Pan","Vishvaswar Provision Store","Shri Baal Krishna Provision Store","Shri Icecream & Cold Drinks","Baba Ramdev Provision Store","Shrinathji Dairy","Purvi General Store","Shri Ram Meldi & Provision Store","Jay Kayla Devi Provision Store"],
"Friday - Diwalipura":["Gurukrupa Pan","Shriji Enterprises","Shivam Traders","Gokul Traders","Matangi Provision Store","Hari Om Stores & Telecom","Bhavani Pro Store","Jay Ambe Super Store","Jay Durga Provision Store","Narayan Provision Store","Shriram Super Store","Shri Mahavir Super Store","Kanha's Scoops & More","Bharat Provision Store","Shri Ram Provision Store","Sidhnath Pro & Farsan Store","Bansidal Dairy","Jay Shree Bhagwati Provision Store","Shri Ram Dairy Shop","Jay Ambe Provision Store","Shri Ganesh Provision Store","Radhe Pan Corner","Shri Keyladevi Provision Store","Shree Jai Jalaram Store"],
"Saturday - Kalali":["Shreeji Pan","Baroda Dairy Parlar","Prasann Soda Shop","Jay Shree Bhairuji Kirana Store","Mahiya Mart","Bindu Provision Store","Shakti Kirana Store","Krishna Super Store","Sukun Provision Store","Khushi Pro Store","Mahadev Mini Mart","Balaji Super Market","Chanakya Provision Store","Devnarayan Provision Store","Saibaba Provision Store","Jay Mataji Pan & Colddrink","Harsiddhi Provision Store","Apna Adda Provision Store","Bajrang Pan","Balaji Super Store -2","MS Super Store","Ganesh Provision Store","Al Makkah Pan","Pick & Eat"]
};
const products=[
["Hakka Noodles Masala (Masala)",10,8,"bandha",20,1],["Paneer Chili Masala (Masala)",10,8,"bandha",20,1],["Veg Manchurian Masala (Masala)",10,8,"bandha",20,1],["Schezwan Fried Rice Masala (Masala)",10,8,"bandha",20,1],["Schezwan Plain Fried Rice Masala (Masala)",10,8,"bandha",20,1],
["Smith & Jones Peri Peri Masala",5,4,"pcs",1,48],["Smith & Jones Pasta Masala",5,4.10,"pcs",1,24],
["Schezwan Chutney (MRP 10 Pouch)",10,8,"special30",60,30],["Schezwan Chutney (MRP 45 Pouch)",45,33,"pcs",1,0],["Schezwan Chutney (MRP 84 Glass Bottle)",84,72,"pcs",1,0],
["Red Chilli Sauce Pouch",25,21,"pcs",1,0],["Green Chilli Sauce Pouch",25,21,"pcs",1,0],["Dark Soy Sauce Pouch",25,21,"pcs",1,0],
["Red Chilli Sauce Glass Bottle",56,45,"pcs",1,0],["Green Chilli Sauce Glass Bottle",56,45,"pcs",1,0],["Dark Soy Sauce Glass Bottle",56,45,"pcs",1,0],["Chilli Vinegar Glass Bottle",56,45,"pcs",1,0],
["Red Chilli Sauce Plastic Bottle",84,45,"pcs",1,0],["Green Chilli Sauce Plastic Bottle",84,45,"pcs",1,0],["Dark Soy Sauce Plastic Bottle",84,45,"pcs",1,0],
["Smith & Jones Ginger Garlic Paste (Small Pouch)",5,3.5,"pcs",1,48],["Smith & Jones Ginger Garlic Paste (Big Pouch)",47,33,"pcs",1,0],
["Hakka Noodles (Without Masala)",30,24,"pcs",1,0],["Hakka Noodles (With Masala Inside)",35,28,"pcs",1,0],
["Instant Soup - Mix Veg",10,8,"bandha",20,1],["Instant Soup - Sweet Corn Veg",10,8,"bandha",20,1],["Instant Soup - Hot & Sour",10,8,"bandha",20,1],["Instant Soup - Manchow",10,8,"bandha",20,1],["Instant Soup - Tomato",10,8,"bandha",20,1],
["Tata Sampann Fine Besan 500g",75,40,"pcs",1,0],["Tata Sampann Poha 500g",57,33,"pcs",1,0],["Tata Soulfull No Maida Rusk Toast",40,30,"pcs",1,0]
].map((x,i)=>({id:i,name:x[0],mrp:x[1],rate:x[2],unit:x[3],pack:x[4],min:x[5]}));

let qty=JSON.parse(localStorage.getItem("salesQty")||"{}");
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("salesQty",JSON.stringify(qty))}
function pieces(p,v){return p.unit==="bandha"?v*p.pack:v}
function rate(p,n){if(p.name.includes("Pasta Masala"))return n>=48?4:4.1;if(p.name.includes("Ginger Garlic Paste (Big Pouch)"))return n>=24?23.5:33;return p.rate}
function calc(){let total=0,n=0;products.forEach((p,i)=>{let v=+qty[i]||0;if(v){n++;total+=pieces(p,v)*rate(p,pieces(p,v))}});$("total").textContent="₹"+total.toFixed(2);$("itemCount").textContent=n+" product"+(n===1?"":"s");$("bottom").classList.toggle("hidden",!n);return total}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function render(){
 const q=$("search").value.trim().toLowerCase(), list=$("list");list.innerHTML="";
 let shown=0;
 products.forEach((p,i)=>{
  if(q&&!p.name.toLowerCase().includes(q))return; shown++;
  const v=+qty[i]||0, r=rate(p,pieces(p,v));
  let note="";
  if(p.unit==="special30")note="⚠️ Minimum 30 pcs";
  else if(p.unit==="bandha")note=`⚠️ Min ${p.min} bandha (${p.min*p.pack} pcs)`;
  else if(p.min)note=`⚠️ Minimum ${p.min} pcs`;
  let rateText=p.unit==="bandha"?`₹${p.rate}/pc`:p.name.includes("Pasta Masala")?"₹4.10 (<48) / ₹4.00 (≥48)":p.name.includes("Ginger Garlic Paste (Big Pouch)")?"₹33 (<24) / ₹23.50 (≥24)":`₹${p.rate}`;
  const el=document.createElement("div");el.className="product"+(v?" selected":"");
  el.innerHTML=`<div class="info"><div class="name">${p.name}</div><div class="meta">MRP ₹${p.mrp} • Rate <b>${rateText}</b></div>${note?`<div class="warn">${note}</div>`:""}</div><div class="qty"><button class="qbtn minus">−</button><input class="qinput" type="number" min="0" inputmode="numeric" value="${v}"><button class="qbtn plus">+</button></div>`;
  const input=el.querySelector(".qinput");
  const set=n=>{n=Math.max(0,parseInt(n)||0);qty[i]=n;input.value=n;el.classList.toggle("selected",n>0);save();calc()};
  el.querySelector(".minus").onclick=()=>set((+qty[i]||0)-1);
  el.querySelector(".plus").onclick=()=>set((+qty[i]||0)+1);
  input.oninput=e=>set(e.target.value);
  list.appendChild(el);
 });
 $("count").textContent=shown+" products";
 if(!shown)list.innerHTML='<div class="empty">No product found</div>';
 calc();
}
function loadShops(){
 const r=$("route").value,s=$("shop");s.innerHTML='<option value="">-- Select shop --</option>';
 if(r&&routes[r])routes[r].forEach(x=>{let o=document.createElement("option");o.value=x;o.textContent=x;s.appendChild(o)});
 $("productsSection").classList.toggle("hidden",!r);$("search").value="";render();
}
function validate(){
 let has=false;
 for(let i=0;i<products.length;i++){let p=products[i],v=+qty[i]||0;if(!v)continue;has=true;let n=pieces(p,v);
  if(p.unit==="special30"&&n<30){alert("Schezwan Chutney MRP 10 ke liye minimum 30 pcs chahiye.");return false}
  if(p.unit==="bandha"&&v<p.min){alert(`${p.name}: minimum ${p.min} bandha (${p.min*p.pack} pcs) chahiye.`);return false}
  if(p.unit==="pcs"&&p.min&&n<p.min){alert(`${p.name}: minimum ${p.min} pcs chahiye.`);return false}
 }
 if(!has){alert("Kam se kam ek product select karein.");return false}return true
}
function send(){
 if(!$("route").value){alert("Day / Route select karein.");return}
 if(!$("shop").value){alert("Shop select karein.");return}
 if(!validate())return;
 let text=`*SALES ORDER*\\n\\n*Shop:* ${$("shop").value}\\n*Route:* ${$("route").value}\\n--------------------------\\n`,total=0;
 products.forEach((p,i)=>{let v=+qty[i]||0;if(!v)return;let n=pieces(p,v),r=rate(p,n),a=n*r;total+=a;text+=`\\n*${p.name}*\\nQty: ${p.unit==="bandha"?v+" Bandha ("+n+" pcs)":v+" pcs"}\\nRate: ₹${r.toFixed(2)}\\nAmount: ₹${a.toFixed(2)}\\n`});
 text+=`\\n--------------------------\\n*GRAND TOTAL: ₹${total.toFixed(2)}*`;
 window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}
Object.keys(routes).forEach(r=>{let o=document.createElement("option");o.value=r;o.textContent=r;$("route").appendChild(o)});
$("route").onchange=loadShops;
$("search").oninput=render;
$("send").onclick=send;
$("clearBtn").onclick=()=>{if(confirm("Current order clear karein?")){qty={};save();render();toast("Order cleared")}};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
